name: Weekly Rider Clustering

on:
  schedule:
    # Sun 20:17 UTC = Mon 04:17 SGT. Off-the-hour minute and a ~5h buffer so that
    # GitHub's best-effort scheduler queue delay still lands the Slack post in the SGT morning.
    - cron: '17 20 * * 0'
  workflow_dispatch:

jobs:
  run-weekly-clustering:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment
        run: |
          echo "REDASH_API_KEY=${{ secrets.REDASH_API_KEY }}" >> .env
          echo "REDASH_BASE_URL=${{ secrets.REDASH_BASE_URL }}" >> .env
          echo "SLACK_TOKEN=${{ secrets.SLACK_TOKEN }}" >> .env
          echo "SLACK_CHANNEL=${{ secrets.SLACK_CHANNEL }}" >> .env

      - name: Run clustering script
        run: python -m weekly.rider_clustering_w
